name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.name }} / RTK ${{ matrix.rtk }}${{ matrix.edition == 'oss' && ' (oss)' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest RTK this server is tested against, the last 0.x, and the current release. The
        # protocol differs between them (`rtk rewrite` exits 0 vs 3 for a rewrite, pipelines are
        # rewritten differently, `gain --recalls` only exists from 0.49, 1.0 renames `proxy` to
        # `bypass`).
        rtk: [v0.34.3, v0.49.0, v1.1.0]
        # From 1.0.0 RTK ships two builds of the same CLI: the standard one and an Apache-2.0
        # "oss" one. Both have to work.
        edition: [full, oss]
        exclude:
          - { rtk: v0.34.3, edition: oss }
          - { rtk: v0.49.0, edition: oss }
        include:
          - { runner: ubuntu-latest, name: Linux, python: python3, exe: "" }
          - { runner: macos-latest, name: macOS, python: python3, exe: "" }
          - { runner: windows-latest, name: Windows, python: python, exe: ".exe" }
    steps:
      # Windows checks files out with CRLF by default; the sources are LF.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Pinned, checksum-verified release binary: fast, and not a moving target like
      # `cargo install --git`. Installed before the tests so the RTK-backed unit tests run too.
      - name: Install RTK ${{ matrix.rtk }} (${{ matrix.edition }})
        uses: ./.github/actions/install-rtk
        with:
          version: ${{ matrix.rtk }}
          edition: ${{ matrix.edition }}

      - name: RTK version
        run: rtk --version

      - name: Shells on this runner
        if: runner.os == 'Windows'
        run: |
          where.exe bash
          git --version

      - name: Unit tests
        run: cargo test --all

      - name: Build release
        run: cargo build --release

      # Real MCP JSON-RPC over stdio against the release binary, in a throwaway HOME:
      # tool surface, RTK routing, deny rules, stats options, timeout/process-tree kill,
      # UTF-8-safe truncation, the no-RTK allowlist fallback, and on Windows the shell choice
      # (Git Bash, cmd.exe) and an rtk.exe installed beside the server.
      - name: MCP functional test
        run: ${{ matrix.python }} tests/functional.py target/release/rtk-mcp${{ matrix.exe }}
