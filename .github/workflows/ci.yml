name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest RTK this server is tested against, and the current release. The protocol differs
        # between them (`rtk rewrite` exits 0 vs 3 for a rewrite, pipelines are rewritten
        # differently, `gain --recalls` only exists from 0.49).
        rtk: [v0.34.3, v0.49.0]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Pinned, checksum-verified release binary: fast, and not a moving target like
      # `cargo install --git`. Installed before the tests so the RTK-backed unit tests run too.
      - name: Install RTK ${{ matrix.rtk }}
        run: |
          set -euo pipefail
          ASSET=rtk-x86_64-unknown-linux-musl.tar.gz
          BASE=https://github.com/rtk-ai/rtk/releases/download/${{ matrix.rtk }}
          curl -fsSL "$BASE/$ASSET" -o "$RUNNER_TEMP/$ASSET"
          curl -fsSL "$BASE/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "[[:space:]]$ASSET\$" checksums.txt | sha256sum -c -)
          mkdir -p "$HOME/.local/bin"
          tar xzf "$RUNNER_TEMP/$ASSET" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: RTK version
        run: rtk --version

      - name: Unit tests
        run: cargo test --all

      - name: Build release
        run: cargo build --release

      # Real MCP JSON-RPC over stdio against the release binary, in a throwaway HOME:
      # tool surface, RTK routing, deny rules, stats options, timeout/process-tree kill,
      # UTF-8-safe truncation, and the no-RTK allowlist fallback.
      - name: MCP functional test
        run: python3 tests/functional.py target/release/rtk-mcp
