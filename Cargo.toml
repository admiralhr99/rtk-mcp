[package]
name = "rtk-mcp"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "MCP server bridge for RTK (Rust Token Killer) — exposes token-optimized CLI filtering to any MCP-compatible client"
license = "MIT"
repository = "https://github.com/admiralhr99/rtk-mcp"
keywords = ["mcp", "rtk", "token-optimization", "cli", "llm"]

[dependencies]
rmcp = { version = "3.7", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shlex = "1.3.0"
# Unpacking and checking the RTK release that install_rtk downloads (the download itself is
# curl's job, so no TLS stack is built in)
sha2 = "0.11"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
